<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="K1266 — Auto Gift Code Redeem & Kingdom Management">
    <title>K1266</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Roboto+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
    <!-- PWA — additive, no logic change -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#06060b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="K1266">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
</head>
<body>
<div class="app-wrapper">

    <!-- ── Nav ── -->
    <nav class="top-nav">
        <div class="nav-inner">
            <a class="nav-brand" onclick="switchTab('members')">K1266</a>
            <div class="nav-tabs" id="nav-tabs">
                <button class="nav-tab active" data-tab="members">
                    <span class="tab-icon">⚔️</span>1266
                </button>
                <button class="nav-tab" data-tab="guides">
                    <span class="tab-icon">📖</span>Guides
                </button>
            </div>
        </div>
    </nav>

    <!-- ── Main ── -->
    <main class="main-content">

        <!-- ════ MEMBERS TAB ════ -->
        <section class="tab-page active" id="members-page">
            <div class="section-container">
                <div class="section-header">
                    <h1 class="section-title section-title--members section-title--clickable" onclick="switchTab('members')">⚔️ K1266</h1>
                    <p class="section-subtitle">Auto Gift Code Redeem</p>
                </div>

                <div class="stats-row" id="stats-row">
                    <div class="stat-item">
                        <div class="stat-value" id="stat-total">—</div>
                        <div class="stat-label">Registered</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">1266</div>
                        <div class="stat-label">Kingdom</div>
                    </div>
                </div>

                <div class="search-input-wrap" style="margin-bottom: 24px;">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="member-search" placeholder="Search your Player ID...">
                </div>

                <div id="search-result"></div>

                <div style="text-align:center; margin-top:24px;">
                    <button class="btn btn-primary" onclick="openAddModal()">+ Add Player</button>
                    <button class="btn btn-secondary push-btn" id="pushBtn" type="button">🔔 Notify me</button>
                </div>

                <div id="last-redeem" class="last-redeem"></div>
            </div>
        </section>

        <!-- ════ GUIDES TAB ════ -->
        <section class="tab-page" id="guides-page">
            <div class="section-container">
                <div class="section-header">
                    <h1 class="section-title section-title--guides section-title--clickable" onclick="switchTab('guides')">📖 Guides</h1>
                    <p class="section-subtitle">Rules, strategies & event guides</p>
                </div>
                <div class="guides-grid" id="guides-grid"></div>
            </div>
        </section>

    </main>
</div>

<!-- ── Floating Redeem Button ── -->
<button class="redeem-fab" id="redeemFab" title="Tap: auto redeem | Hold: enter code">
    <span class="fab-icon">🎁</span>
    <span class="fab-tooltip">Tap: Auto · Hold: Manual</span>
</button>
<div class="redeem-toast" id="redeemToast"></div>

<!-- ── Add Member Modal ── -->
<div class="modal-backdrop" id="add-modal">
    <div class="modal-panel">
        <div class="modal-header-row">
            <div class="modal-title">Add Player</div>
            <button class="modal-close" onclick="closeAddModal()">✕</button>
        </div>
        <div class="form-group">
            <label class="form-label">Player ID</label>
            <input type="text" class="form-input" id="new-player-id" placeholder="e.g. 183455373">
        </div>
        <div class="form-group">
            <label class="form-label">Kingdom</label>
            <input type="text" class="form-input" id="new-player-kid" value="1266" placeholder="1266">
        </div>
        <div id="add-alert" class="alert"></div>
        <div class="form-actions">
            <button class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
            <button class="btn btn-primary" id="btn-submit" onclick="submitNewMember()">Add</button>
        </div>
    </div>
</div>

<!-- ── Manual Code Entry Modal ── -->
<div class="modal-backdrop" id="code-modal">
    <div class="modal-panel">
        <div class="modal-header-row">
            <div class="modal-title">Enter Gift Code</div>
            <button class="modal-close" onclick="closeCodeModal()">✕</button>
        </div>
        <!-- real <form> so mobile keyboards' "Go/Enter" submits -->
        <form id="code-form">
            <div class="form-group">
                <label class="form-label">Gift Code</label>
                <input type="text" class="form-input" id="manual-code-input"
                       placeholder="e.g. TGIF1107" autocomplete="off" autocapitalize="characters"
                       enterkeyhint="go">
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" type="button" onclick="closeCodeModal()">Cancel</button>
                <button class="btn btn-primary" type="submit">Redeem</button>
            </div>
        </form>
    </div>
</div>

<script src="js/app.js"></script>
<script src="js/members.js"></script>
<script src="js/guides.js"></script>
<script src="js/redeem.js"></script>
<script src="js/status.js"></script>
<script src="js/push.js"></script>
<script src="js/pwa-install.js"></script>
<script>
// Register Service Worker (PWA) — additive only, no logic change
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW registration failed', e));
  });
}
</script>
</body>
</html>
