<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Push interop test</title></head>
<body>
<h1>K1266 Web Push interop test</h1>
<button id="go">Enable notifications</button>
<pre id="out"></pre>
<script>
const PUB = 'BHlnR6xkhYfV1v_XLW9wKzZpinl1oNlhHTqbmMvIHeml1D6dcT2dw9reoBWTQ6xHgTZ0y1DYOId_D0kEhZxDPAc';
const out = document.getElementById('out');
const log = (m) => { out.textContent += '\n' + m; };

function urlB64ToU8(s) {
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const b64 = (s + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(b64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

document.getElementById('go').onclick = async () => {
  try {
    const reg = await navigator.serviceWorker.register('./sw.js');
    log('SW registered: ' + reg.scope);
    const perm = await Notification.requestPermission();
    log('permission: ' + perm);
    if (perm !== 'granted') return;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToU8(PUB) });
      log('new subscription');
    } else {
      log('existing subscription');
    }
    log('SUBSCRIPTION_JSON ' + JSON.stringify(sub.toJSON()));
  } catch (e) {
    log('ERROR: ' + e.message);
  }
};
</script>
</body>
</html>
